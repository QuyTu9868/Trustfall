[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib", "node_modules"]
solc = "0.8.24"
# Must match hardhat.config.js, otherwise tested bytecode differs from deployed bytecode.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/",
]
